# Render Blueprint for SWERV Delivery Time Prediction Service
# Operational Standby with Verified Demo Endpoint Configuration

services:
  - type: web
    name: swerv-delivery-time-prediction
    runtime: python
    rootDir: ml/delivery_time_prediction
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: SWERV_ENV
        value: production
      # Operational model remains unset for safe production standby:
      # DELIVERY_MODEL_PATH and APPROVED_MODEL_SHA256 remain unset.
      # Operational /predict strictly returns HTTP 503.
      #
      # Demo endpoint configuration:
      - key: ENABLE_DEMO_ENDPOINT
        value: "true"
      - key: DEMO_MODEL_PATH
        value: models/v2/gradient_boosting.joblib
      - key: DEMO_APPROVED_MODEL_SHA256
        value: 2e7b05c087e5bb2fbfed1f4766895d7626e0611b6f60f0b9be638a8822f7cafb
