services:
  - type: web
    name: swerv-smart-agent-assignment
    runtime: python
    rootDir: ml/smart_agent_assignment
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SMART_AGENT_ASSIGNMENT_API_KEY
        generateValue: true
